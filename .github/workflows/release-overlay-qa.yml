name: Isolated signed APK overlay tests
on:
  push:
    branches: [qa/release-overlays-209]
    paths: ['.github/workflows/release-overlay-qa.yml', 'tools/qa-overlay/**']
permissions:
  contents: read
  actions: read
jobs:
  overlays:
    if: github.repository == '0425-sketch/rikkahub'
    runs-on: ubuntu-24.04
    permissions:
      # GitHub denies GET of an existing draft to a contents:read token (403).
      # The token is passed only to the metadata/download step; no Release is mutated.
      contents: write
      actions: read
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: build-tools;37.0.0 platform-tools emulator
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Boot a disposable userdebug emulator with ARM64 support
        run: |
          set -eu
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          sdkmanager 'system-images;android-30;google_apis;x86_64'
          echo no | avdmanager create avd -n rikkaoverlay -k 'system-images;android-30;google_apis;x86_64' -d pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd rikkaoverlay -no-window -no-audio -no-boot-anim -no-snapshot -writable-system -gpu swiftshader_indirect -accel on -memory 3072 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          timeout 420 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 3; done'
          for i in {1..8}; do
            adb root || true
            sleep 2
            adb wait-for-device
            if [ "$(adb shell id -u | tr -d '\r')" = 0 ]; then break; fi
          done
          test "$(adb shell id -u | tr -d '\r')" = 0
          adb shell input keyevent 82
          adb shell wm size 720x1440
          adb shell wm density 270
          adb shell getprop ro.product.cpu.abilist | grep arm64-v8a
          for scale in window_animation_scale transition_animation_scale animator_duration_scale; do adb shell settings put global "$scale" 0; done
          mkdir "$RUNNER_TEMP/overlay"
          echo "RQA_DATA=$RUNNER_TEMP/overlay" >> "$GITHUB_ENV"
          echo "RQA_CODE=$GITHUB_WORKSPACE/tools/qa-overlay" >> "$GITHUB_ENV"
      - name: Seed chat, image, preferences, memory and local usage in the original APK
        run: |
          python -m pip install --quiet Pillow cryptography
          bash tools/qa-overlay/seed.sh
      - name: Fetch exact signed candidates for the selected run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tools/qa-overlay/wait_stage.sh
      - name: Exercise update download, system replacement, data and usage growth
        run: |
          if [[ "$(cat "$RQA_CODE/mode")" == public ]]; then
            python -u tools/qa-overlay/flow.py public
          else
            bash tools/qa-overlay/ca.sh
            python -u tools/qa-overlay/flow.py controlled
            python -u tools/qa-overlay/reject.py
            python -u tools/qa-overlay/flow.py next
          fi
      - name: Collect synthetic acceptance snapshots
        if: always()
        run: |
          adb shell dumpsys activity activities | grep -E 'topResumedActivity|mResumedActivity' | head -5 || true
          adb logcat -d -v brief 'AndroidRuntime:E' '*:S' | tail -50 || true
          for f in "$RUNNER_TEMP"/overlay/snapshot-*.json "$RUNNER_TEMP/overlay/fixture.log" "$RUNNER_TEMP/overlay/provider.log"; do
            test ! -f "$f" || tail -100 "$f"
          done
          adb shell uiautomator dump /sdcard/result-ui.xml >/dev/null 2>&1 && adb pull /sdcard/result-ui.xml "$RUNNER_TEMP/overlay/result-ui.xml" || true
          adb exec-out screencap -p > "$RUNNER_TEMP/overlay/result-screen.png" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disposable-overlay-evidence
          path: |
            ${{ runner.temp }}/overlay/snapshot-*.json
            ${{ runner.temp }}/overlay/result-ui.xml
            ${{ runner.temp }}/overlay/result-screen.png
            ${{ runner.temp }}/overlay/fixture.log
          retention-days: 10
