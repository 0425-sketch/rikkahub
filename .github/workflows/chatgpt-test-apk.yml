name: Build and deliver ChatGPT OAuth test APK

on:
  push:
    branches: [custom-3.2.0]
    paths:
      - .github/workflows/chatgpt-test-apk.yml
      - tools/publish-chatgpt-test.py
      - docs/chatgpt-oauth-build-request.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rikkahub-chatgpt-test-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.repository == '0425-sketch/rikkahub' && github.ref == 'refs/heads/custom-3.2.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify source identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install locked web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Reuse Gradle dependency cache
        uses: actions/cache@v4
        with:
          # Never cache Android's debug keystore, project config cache, or signing files.
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-chatgpt-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-chatgpt-gradle-

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Same command-line tools 23.0 as the successfully verified local build.
          cmdline-tools-version: '16111833'
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Prepare Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          unset ANDROID_SDK_HOME
          sdkmanager 'platforms;android-37.0' 'platforms;android-37.2' \
            'build-tools;36.0.0' 'build-tools;37.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'

      - name: Restore optional private signing configuration
        env:
          CHATGPT_TEST_KEYSTORE_B64: ${{ secrets.CHATGPT_TEST_KEYSTORE_B64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          encoded = os.environ.get("CHATGPT_TEST_KEYSTORE_B64")
          if encoded:
              path = Path(os.environ["RUNNER_TEMP"]) / "chatgpt-test.keystore"
              path.touch(mode=0o600)
              path.write_bytes(base64.b64decode(encoded, validate=True))
              with open(os.environ["GITHUB_ENV"], "a") as env:
                  env.write(f"CHATGPT_TEST_KEYSTORE={path}\n")
              print("Using securely configured fixed signing key.")
          else:
              print("Using a temporary debug signer for the independent test package; future upgrade signing is not persisted.")
          PY

      - name: Run protocol and regression tests and build current ARM64 APK
        env:
          CHATGPT_TEST_STORE_PASSWORD: ${{ secrets.CHATGPT_TEST_STORE_PASSWORD }}
          CHATGPT_TEST_KEY_ALIAS: ${{ secrets.CHATGPT_TEST_KEY_ALIAS }}
          CHATGPT_TEST_KEY_PASSWORD: ${{ secrets.CHATGPT_TEST_KEY_PASSWORD }}
        run: |
          unset ANDROID_SDK_HOME
          ./gradlew --no-daemon --no-configuration-cache --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process \
            :oauth:testDebugUnitTest :ai:testDebugUnitTest :app:testGithubDebugUnitTest \
            :app:assembleGithubDebug

      - name: Verify APK, publish unique prerelease and verify public download
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/publish-chatgpt-test.py \
            --apk app/build/outputs/apk/github/debug/app-github-arm64-v8a-debug.apk \
            --build-tools "$ANDROID_HOME/build-tools/37.0.0" \
            --output work/chatgpt-delivery

      - name: Retain test reports and public delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-test-verification-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            oauth/build/test-results/testDebugUnitTest/*.xml
            ai/build/test-results/testDebugUnitTest/*.xml
            app/build/test-results/testGithubDebugUnitTest/*.xml
            work/chatgpt-delivery/build-provenance.json
            work/chatgpt-delivery/verified-delivery.json

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/chatgpt-test.keystore" "$HOME/.android/debug.keystore"
