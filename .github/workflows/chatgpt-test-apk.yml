name: Personal Release · stage or publish a tested ARM64 APK
'on':
  push:
    branches:
    - migration/release-209
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        description: Stage signed APKs privately, or publish the tested candidate
        options:
        - stage
        - publish
        default: stage
        required: true
      stage_run:
        type: string
        description: Publish only · successful staging run ID
      stage_attempt:
        type: string
        description: Publish only · staging attempt
      tested_sha256:
        type: string
        description: Publish only · ARM64 APK SHA-256 after successful device upgrade and data checks
permissions:
  contents: read
concurrency:
  group: rikkahub-personal-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == '0425-sketch/rikkahub' && (github.ref_name == 'custom-3.2.0' || github.ref_name == 'migration/release-209') && (github.event_name == 'push' || inputs.operation == 'stage')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - name: Check out the exact workflow commit
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Verify source identity
      env:
        EXPECTED_SHA: ${{ github.sha }}
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Install signing test dependencies in an isolated environment
      run: |-
        python3 -m venv "$RUNNER_TEMP/personal-signing-python"
        "$RUNNER_TEMP/personal-signing-python/bin/pip" install --disable-pip-version-check PyNaCl==1.6.0
        echo "$RUNNER_TEMP/personal-signing-python/bin" >> "$GITHUB_PATH"
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: '11'
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: web-ui/pnpm-lock.yaml
    - name: Install locked web dependencies
      working-directory: web-ui
      run: pnpm install --frozen-lockfile
    - name: Reuse Gradle dependency cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/wrapper
        key: ${{ runner.os }}-chatgpt-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-chatgpt-gradle-
    - name: Set up Android command-line tools
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        cmdline-tools-version: '16111833'
        packages: platform-tools
        accept-android-sdk-licenses: true
        log-accepted-android-sdk-licenses: false
    - name: Prepare Android SDK packages
      shell: bash
      run: |-
        set -euo pipefail
        unset ANDROID_SDK_HOME
        sdkmanager 'platforms;android-37.0' 'platforms;android-37.2' \
          'build-tools;36.0.0' 'build-tools;37.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
    - name: Prepare verified Android SDKs for Robolectric 4.18
      run: |-
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/robolectric-sdks"
        cd "$RUNNER_TEMP/robolectric-sdks"
        # Android 15 runs the tests. Android 17 provides compile-SDK resources.
        for sdk in 15-robolectric-14663667-2-i7 17-robolectric-16653203-i7; do
          name="android-all-instrumented-$sdk.jar"
          url="https://repo.maven.apache.org/maven2/org/robolectric/android-all-instrumented/$sdk/$name"
          curl --fail --silent --show-error --location --retry 3 --output "$name" "$url"
          digest=$(curl --fail --silent --show-error --location --retry 3 "$url.sha512")
          echo "$digest  $name" | sha512sum --check --strict
        done
    - name: Run protocol, cache, migration and application regression tests
      env:
        JAVA_TOOL_OPTIONS: -Drobolectric.offline=true -Drobolectric.dependency.dir=${{ runner.temp }}/robolectric-sdks
      run: |-
        unset ANDROID_SDK_HOME
        ./gradlew --no-daemon --no-configuration-cache --max-workers=2 \
          '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' \
          -Pkotlin.compiler.execution.strategy=in-process \
          --rerun-tasks \
          :oauth:testDebugUnitTest :ai:testDebugUnitTest :common:testDebugUnitTest \
          :mediagen:testDebugUnitTest :ui:testDebugUnitTest :search:testDebugUnitTest :speech:testDebugUnitTest :workspace:testDebugUnitTest \
          :app:testGithubDebugUnitTest :app:compileGithubDebugAndroidTestKotlin
    - name: Check signing, publication and database guards
      run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/tests -p 'test_*.py'
    - name: Retain public test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: personal-tests-${{ github.sha }}-${{ github.run_attempt }}
        retention-days: 14
        path: |-
          oauth/build/test-results/testDebugUnitTest/*.xml
          ai/build/test-results/testDebugUnitTest/*.xml
          mediagen/build/test-results/testDebugUnitTest/*.xml
          ui/build/test-results/testDebugUnitTest/*.xml
          search/build/test-results/testDebugUnitTest/*.xml
          common/build/test-results/testDebugUnitTest/*.xml
          speech/build/test-results/testDebugUnitTest/*.xml
          workspace/build/test-results/testDebugUnitTest/*.xml
          app/build/test-results/testGithubDebugUnitTest/*.xml
  signed-build:
    name: Restore and build (${{ matrix.source }})
    needs: qa-draft
    if: github.repository == '0425-sketch/rikkahub' && (github.ref_name == 'custom-3.2.0' || github.ref_name == 'migration/release-209') && (github.event_name == 'push' || inputs.operation == 'stage')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        source:
        - primary
        - backup
    steps:
    - name: Check out the exact workflow commit
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Verify source identity
      env:
        EXPECTED_SHA: ${{ github.sha }}
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: '11'
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: web-ui/pnpm-lock.yaml
    - name: Install locked web dependencies
      working-directory: web-ui
      run: pnpm install --frozen-lockfile
    - name: Reuse Gradle dependency cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/wrapper
        key: ${{ runner.os }}-chatgpt-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-chatgpt-gradle-
    - name: Set up Android command-line tools
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        cmdline-tools-version: '16111833'
        packages: platform-tools
        accept-android-sdk-licenses: true
        log-accepted-android-sdk-licenses: false
    - name: Prepare Android SDK packages
      shell: bash
      run: |-
        set -euo pipefail
        unset ANDROID_SDK_HOME
        sdkmanager 'platforms;android-37.0' 'platforms;android-37.2' \
          'build-tools;36.0.0' 'build-tools;37.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
    - name: Verify the published Debug 209 APK and its certificate
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |-
        set -euo pipefail
        tag=custom-3.3.0-personal-590dca0ef8ca-45763808599-1
        name=rikkahub-3.3.0-personal.9-590dca0ef8ca-arm64.apk
        gh release download "$tag" -p "$name" -D "$RUNNER_TEMP"
        echo "de0657f2ee1d08e2ae9bac27ce8f36e67c7e9bf8ab3a4c57f2073d9e4f24af8b  $RUNNER_TEMP/$name" | sha256sum --check --strict
        cert=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/$name" | awk '/certificate SHA-256 digest:/ {print $NF}')
        test "$cert" = "$(jq -r .certificate_sha256 docs/chatgpt-personal-signing.json)"
    - name: Restore only the selected durable signing copy
      env:
        RIKKAHUB_PERSONAL_SIGNING: ${{ matrix.source == 'primary' && secrets.RIKKAHUB_PERSONAL_SIGNING || '' }}
        RIKKAHUB_PERSONAL_SIGNING_BACKUP: ${{ matrix.source == 'backup' && secrets.RIKKAHUB_PERSONAL_SIGNING_BACKUP || '' }}
      run: python3 tools/chatgpt-signing.py restore --source "${{ matrix.source }}" --identity docs/chatgpt-personal-signing.json --output "$RUNNER_TEMP/personal-signing"
    - name: Build the optimized, signed GitHub Release
      run: |-
        unset ANDROID_SDK_HOME
        ./gradlew --no-daemon --no-configuration-cache --max-workers=2 \
          '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' \
          -Pkotlin.compiler.execution.strategy=in-process \
          :app:assembleGithubRelease
    - name: Check the ARM64 APK, merged manifest, R8 outputs and runtime dependencies
      env:
        ROLE: ${{ matrix.source }}
      run: |-
        set -euo pipefail
        apk=app/build/outputs/apk/github/release/app-github-arm64-v8a-release.apk
        mkdir -p "work/$ROLE"
        cp "$apk" "work/$ROLE/$ROLE.apk"
        cp "$RUNNER_TEMP/personal-signing/signing-restoration-$ROLE.json" "work/$ROLE/"
        tools="$ANDROID_HOME/build-tools/37.0.0"
        python3 tools/personal-release.py --verify-only --apk "$apk" --build-tools "$tools" --output "work/$ROLE"
        mapping=app/build/outputs/mapping/githubRelease
        test -s "$mapping/mapping.txt"
        test -s "$mapping/usage.txt"
        test -s "$mapping/configuration.txt"
        if grep -Eq '^[[:space:]]*-(dontshrink|dontoptimize)([[:space:]]|$)' "$mapping/configuration.txt"; then exit 1; fi
        unset ANDROID_SDK_HOME
        ./gradlew --no-daemon --no-configuration-cache :app:dependencies --configuration githubReleaseRuntimeClasspath --console=plain > "work/$ROLE/runtime-$ROLE.txt"
        manifest=app/build/intermediates/merged_manifests/githubRelease/processGithubReleaseManifest/arm64-v8a/AndroidManifest.xml
        test -s "$manifest"
        python3 tools/verify-release-runtime.py --apk "$apk" --merged-manifest "$manifest" --runtime-dependencies "work/$ROLE/runtime-$ROLE.txt" --build-tools "$tools"
    - name: Build the nonpublic successor for the second upgrade
      if: matrix.source == 'primary'
      run: |-
        unset ANDROID_SDK_HOME
        ./gradlew --no-daemon --no-configuration-cache --max-workers=2 \
          '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' \
          -Pkotlin.compiler.execution.strategy=in-process \
          -PpersonalNextCandidate=true :app:assembleGithubRelease
        apk=app/build/outputs/apk/github/release/app-github-arm64-v8a-release.apk
        python3 tools/personal-release.py --verify-only --successor --apk "$apk" --build-tools "$ANDROID_HOME/build-tools/37.0.0" --output work/next
        cp "$apk" work/primary/next-candidate.apk
    - name: Remove temporary private signing files
      if: always()
      run: |-
        if [ -n "${CHATGPT_SIGNING_TEMP_DIRECTORY:-}" ]; then rm -rf "$CHATGPT_SIGNING_TEMP_DIRECTORY"; fi
        rm -rf "$RUNNER_TEMP/personal-signing"
        rm -f "$HOME/.android/debug.keystore"
    - name: Stage signed APKs in the private draft
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        ROLE: ${{ matrix.source }}
      run: |-
        set -euo pipefail
        files=("work/$ROLE/$ROLE.apk" "work/$ROLE/signing-restoration-$ROLE.json" "work/$ROLE/runtime-$ROLE.txt")
        if [ "$ROLE" = primary ]; then files+=(work/primary/next-candidate.apk); fi
        python3 tools/release_delivery.py "${files[@]}"
    permissions:
      contents: write
  publish:
    name: Publish previously accepted bytes as Latest
    if: github.repository == '0425-sketch/rikkahub' && github.ref_name == 'custom-3.2.0' && github.event_name == 'workflow_dispatch' && inputs.operation == 'publish'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
    - name: Check out the exact workflow commit
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Set up APK inspection tools
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        cmdline-tools-version: '16111833'
        packages: build-tools;37.0.0
        accept-android-sdk-licenses: true
        log-accepted-android-sdk-licenses: false
    - env:
        GITHUB_TOKEN: ${{ github.token }}
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        STAGE_RUN: ${{ inputs.stage_run }}
        STAGE_ATTEMPT: ${{ inputs.stage_attempt }}
        TESTED_SHA256: ${{ inputs.tested_sha256 }}
      run: |-
        set -euo pipefail
        [[ "$STAGE_RUN" =~ ^[1-9][0-9]*$ && "$STAGE_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
        tag="qa-personal-${STAGE_RUN}-${STAGE_ATTEMPT}"
        gh release view "$tag" --json isDraft,targetCommitish | jq -e --arg sha "$GITHUB_SHA" '.isDraft and .targetCommitish == $sha' > /dev/null
        gh release download "$tag" -D work/staged -p primary.apk -p backup.apk -p 'signing-restoration-*.json' -p '*.sha256' -p build-provenance.json -p release-notes.txt
        python3 tools/personal-release.py --promote --stage-run "$STAGE_RUN" --stage-attempt "$STAGE_ATTEMPT" \
          --tested-sha256 "$TESTED_SHA256" --staged-files work/staged \
          --apk work/staged/primary.apk --recovery-apk work/staged/backup.apk \
          --primary-receipt work/staged/signing-restoration-primary.json --backup-receipt work/staged/signing-restoration-backup.json \
          --build-tools "$ANDROID_HOME/build-tools/37.0.0" --output work/prepared
      name: Verify staged files and promote
    - name: Retain public delivery proof
      uses: actions/upload-artifact@v4
      with:
        name: personal-delivery-${{ github.sha }}-${{ github.run_attempt }}
        path: work/prepared/verified-delivery.json
        if-no-files-found: error
        retention-days: 14
  qa-draft:
    name: Open a collaborator-only draft for device tests
    if: github.repository == '0425-sketch/rikkahub' && (github.ref_name == 'custom-3.2.0' || github.ref_name == 'migration/release-209') && (github.event_name == 'push' || inputs.operation == 'stage')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: Check out the exact workflow commit
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: python3 tools/release_delivery.py
  prepare:
    name: Verify both restores and prepare the 209-compatible feed files
    if: github.repository == '0425-sketch/rikkahub' && (github.ref_name == 'custom-3.2.0' || github.ref_name == 'migration/release-209') && (github.event_name == 'push' || inputs.operation == 'stage')
    needs:
    - signed-build
    - validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
    - name: Check out the exact workflow commit
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Set up APK inspection tools
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        cmdline-tools-version: '16111833'
        packages: build-tools;37.0.0
        accept-android-sdk-licenses: true
        log-accepted-android-sdk-licenses: false
    - env:
        GITHUB_TOKEN: ${{ github.token }}
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        STAGE_RUN: ${{ github.run_id }}
        STAGE_ATTEMPT: ${{ github.run_attempt }}
      run: |-
        set -euo pipefail
        [[ "$STAGE_RUN" =~ ^[1-9][0-9]*$ && "$STAGE_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
        tag="qa-personal-${STAGE_RUN}-${STAGE_ATTEMPT}"
        gh release view "$tag" --json isDraft,targetCommitish | jq -e --arg sha "$GITHUB_SHA" '.isDraft and .targetCommitish == $sha' > /dev/null
        gh release download "$tag" -D work/staged -p primary.apk -p backup.apk -p 'signing-restoration-*.json'
        python3 tools/personal-release.py --prepare \
          --apk work/staged/primary.apk --recovery-apk work/staged/backup.apk \
          --primary-receipt work/staged/signing-restoration-primary.json --backup-receipt work/staged/signing-restoration-backup.json \
          --build-tools "$ANDROID_HOME/build-tools/37.0.0" --output work/prepared
        python3 tools/release_delivery.py work/prepared/*.sha256 work/prepared/*.json work/prepared/release-notes.txt
        jq '{source_commit, version_code, version_name, apk_sha256, apk_size, tag}' work/prepared/build-provenance.json
      name: Prepare feed files in the candidate draft
