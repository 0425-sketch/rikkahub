name: Upload existing RikkaHub test APK

on:
  push:
    branches: [custom-3.2.0]
    paths:
      - .github/workflows/upload-existing-apk.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rikkahub-custom-3.2.0-test-upload
  cancel-in-progress: false

jobs:
  upload:
    if: github.repository == '0425-sketch/rikkahub' && github.ref == 'refs/heads/custom-3.2.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the verified APK and delivery script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Reviewed existing APK and delivery script; do not rebuild or follow branch changes.
          ref: 4bd01157b0c8d32a9a1aac4e4266208c2a472a4a
          persist-credentials: false

      - name: Verify the exact tested APK
        shell: bash
        run: |
          set -euo pipefail
          apk=artifacts/3.2.0/app-github-arm64-v8a-debug.apk
          test "$(stat -c %s "$apk")" = 60503521
          printf '%s  %s\n' '6f93a66b393c050b61ed6001c0dbf3c259997ce786418a4f4e7137cf7b2ceb4d' "$apk" | sha256sum --check --strict -

      - name: Upload missing assets and verify public downloads
        env:
          # GitHub supplies this temporary repository-scoped token automatically.
          RIKKAHUB_RELEASE_TOKEN: ${{ github.token }}
        run: |
          python3 tools/upload-release-assets.py \
            --repo 0425-sketch/rikkahub \
            --tag custom-3.2.0-test \
            --release-id 446959646 \
            --apk artifacts/3.2.0/app-github-arm64-v8a-debug.apk
