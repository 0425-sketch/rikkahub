name: Persist personal signing identity once
'on':
  push:
    branches:
    - custom-3.2.0
    paths:
    - .github/workflows/chatgpt-signing-bootstrap.yml
    - tools/chatgpt-signing.py
    - docs/chatgpt-signing-bootstrap-request.txt
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: rikkahub-personal-signing-bootstrap
  cancel-in-progress: false
jobs:
  persist-signing:
    if: github.repository == '0425-sketch/rikkahub' && github.ref == 'refs/heads/custom-3.2.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Check out the exact workflow commit
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Verify source identity
      env:
        EXPECTED_SHA: ${{ github.sha }}
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Install signing test dependencies in an isolated environment
      run: |-
        python3 -m venv "$RUNNER_TEMP/personal-signing-python"
        "$RUNNER_TEMP/personal-signing-python/bin/pip" install --disable-pip-version-check PyNaCl==1.6.0
        echo "$RUNNER_TEMP/personal-signing-python/bin" >> "$GITHUB_PATH"
    - name: Persist or repair the fixed signing identity without rotating it
      env:
        RIKKAHUB_SIGNING_SETUP_TOKEN: ${{ secrets.RIKKAHUB_SIGNING_SETUP_TOKEN }}
        RIKKAHUB_PERSONAL_SIGNING: ${{ secrets.RIKKAHUB_PERSONAL_SIGNING }}
        RIKKAHUB_PERSONAL_SIGNING_BACKUP: ${{ secrets.RIKKAHUB_PERSONAL_SIGNING_BACKUP }}
      run: python3 tools/chatgpt-signing.py bootstrap --identity docs/chatgpt-personal-signing.json --output "$RUNNER_TEMP/personal-signing-setup"
    - name: Retain only public persistence receipts
      uses: actions/upload-artifact@v4
      with:
        name: personal-signing-public-${{ github.sha }}-${{ github.run_attempt }}
        retention-days: 30
        path: |-
          ${{ runner.temp }}/personal-signing-setup/signing-identity.json
          ${{ runner.temp }}/personal-signing-setup/signing-persistence.json
    - name: Remove temporary bootstrap files
      if: always()
      run: rm -rf "$RUNNER_TEMP/personal-signing-setup"
