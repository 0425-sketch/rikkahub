# Artifact delivery only. Restores the existing primary and backup signers.
# No Release creation, repository writes, signer bootstrap, or private-key artifacts.
name: Build personal APK artifact with existing signer
'on':
  push:
    branches:
    - build/personal-3.3.0
permissions:
  contents: read
concurrency:
  group: rikkahub-personal-artifact-${{ github.ref }}
  cancel-in-progress: false
jobs:
  signed-build:
    name: Restore and build (${{ matrix.source }})
    if: github.repository == '0425-sketch/rikkahub' && github.ref == 'refs/heads/build/personal-3.3.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        source:
        - primary
        - backup
    steps:
    - name: Check out the exact workflow commit
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Verify source identity
      env:
        EXPECTED_SHA: ${{ github.sha }}
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: '11'
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: web-ui/pnpm-lock.yaml
    - name: Install locked web dependencies
      working-directory: web-ui
      run: pnpm install --frozen-lockfile
    - name: Reuse Gradle dependency cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/wrapper
        key: ${{ runner.os }}-chatgpt-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-chatgpt-gradle-
    - name: Set up Android command-line tools
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        cmdline-tools-version: '16111833'
        packages: platform-tools
        accept-android-sdk-licenses: true
        log-accepted-android-sdk-licenses: false
    - name: Prepare Android SDK packages
      shell: bash
      run: |
        set -euo pipefail
        unset ANDROID_SDK_HOME
        sdkmanager 'platforms;android-37.0' 'platforms;android-37.2' \
          'build-tools;36.0.0' 'build-tools;37.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
    - name: Restore only the selected durable signing copy
      env:
        RIKKAHUB_PERSONAL_SIGNING: ${{ matrix.source == 'primary' && secrets.RIKKAHUB_PERSONAL_SIGNING || '' }}
        RIKKAHUB_PERSONAL_SIGNING_BACKUP: ${{ matrix.source == 'backup' && secrets.RIKKAHUB_PERSONAL_SIGNING_BACKUP || '' }}
      run: python3 tools/chatgpt-signing.py restore --source "${{ matrix.source }}" --identity docs/chatgpt-personal-signing.json --output "$RUNNER_TEMP/personal-signing"
    - name: Build using the restored fixed signer
      run: |-
        unset ANDROID_SDK_HOME
        ./gradlew --no-daemon --no-configuration-cache --max-workers=2 \
          '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' \
          -Pkotlin.compiler.execution.strategy=in-process \
          :app:assembleGithubDebug
    - name: Inspect actual ARM64 signature and identity
      run: |-
        python3 tools/publish-chatgpt-test.py --verify-only --apk app/build/outputs/apk/github/debug/app-github-arm64-v8a-debug.apk --build-tools "$ANDROID_HOME/build-tools/37.0.0" --output work/personal-${{ matrix.source }}
        cp "$RUNNER_TEMP/personal-signing/signing-restoration-${{ matrix.source }}.json" work/personal-${{ matrix.source }}/
        cp app/build/outputs/apk/github/debug/app-github-arm64-v8a-debug.apk work/personal-${{ matrix.source }}/candidate.apk
        python3 - <<'PYCODE'
        import json
        from pathlib import Path
        metadata = json.loads(Path("work/personal-${{ matrix.source }}/apk-verification.json").read_text())
        if metadata.get("fixed_certificate_matches") is not True:
            raise SystemExit("APK certificate does not match the existing personal signer")
        PYCODE
    - name: Retain signed APK and public restoration evidence
      uses: actions/upload-artifact@v4
      with:
        name: personal-build-${{ matrix.source }}-${{ github.sha }}-${{ github.run_attempt }}
        retention-days: 14
        path: |-
          work/personal-${{ matrix.source }}/candidate.apk
          work/personal-${{ matrix.source }}/apk-verification.json
          work/personal-${{ matrix.source }}/signing-restoration-${{ matrix.source }}.json
        if-no-files-found: error
    - name: Remove temporary private signing files
      if: always()
      run: |-
        if [ -n "${CHATGPT_SIGNING_TEMP_DIRECTORY:-}" ]; then rm -rf "$CHATGPT_SIGNING_TEMP_DIRECTORY"; fi
        rm -rf "$RUNNER_TEMP/personal-signing"
        rm -f "$HOME/.android/debug.keystore"
