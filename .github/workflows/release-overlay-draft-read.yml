name: Check test runner draft read access
on:
  push:
    branches: [qa/release-overlays-209]
    paths: ['.github/workflows/release-overlay-draft-read.yml']
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-24.04
    steps:
      - name: Request private draft metadata by known ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/0425-sketch/rikkahub/releases/460213130" --jq '{tag_name,draft}'
